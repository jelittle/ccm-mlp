# Where this repo looks for data and where it writes results.
#
# Every other config refers to these by name, e.g. "${data_root}/LightboxCaptures/...".
# No config anywhere in this repo should contain an absolute path; edit this file
# instead. Relative values are interpreted from the repository root.
#
# Each entry can also be overridden per-run with an environment variable, without
# editing this file — useful when the captures live on a separate volume:
#
#   CC_RAW_DATA_ROOT=/mnt/captures \
#   CC_OUTPUT_ROOT=/scratch/cc_runs \
#   python training/runner.py --config ...

paths:
  # The unpacked download (the "OffthePlanckianLocus" folder). Read-only inputs:
  #   lightbox/<Camera>/{dng_renamed,jpg_renamed}   raw lightbox captures
  #   InTheWild/{pixel,samsung}/...                 already-processed wild captures
  #   camera_spectral_sensitivites/<camera>.txt     spectral response curves
  raw_data_root: "data"

  # Where data_processing/ writes: extracted patches and the generated split yamls.
  # Nothing here comes from the download; it is all produced locally.
  data_root: "project_data"

  # Camera spectral sensitivities. Point this at the download's
  # camera_spectral_sensitivites/ folder; the *_simulated.npy files generated by
  # data_processing/simulating_colors/ are written alongside the .txt inputs.
  sim_root: "assets/simulated"

  # Checkpoints, per-image .npy evaluation dumps, and compiled metrics CSVs.
  output_root: "outputs"
